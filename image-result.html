<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trustlock Image Screening</title>
    <link rel="stylesheet" href="image-result.css">
    <script src="image-result.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">T</div>
        <div><p class="eyebrow">TRUSTLOCK · IMAGE CHECK</p><h1>Image screening</h1></div>
      </header>
      <section id="result" class="card" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <h2>Preparing analysis</h2>
        <p>Sending a resized copy to your local Trustlock backend. The image is processed temporarily and is not saved to a case.</p>
      </section>
      <footer>Screening signal only · Not proof of authenticity or identity</footer>
    </main>
  </body>
</html>
